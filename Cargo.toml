[package]
name = "benchmark"
version = "0.4.0"
edition = "2024"
authors = ["CMD+RVL <engineering@cmdrvl.com>"]
description = "Gold-set scoring for row-oriented extraction pipelines"
license = "MIT"
repository = "https://github.com/cmdrvl/benchmark"
readme = "README.md"
keywords = ["benchmark", "scoring", "cli", "extraction", "validation"]
categories = ["command-line-utilities"]

[[bin]]
name = "benchmark"
path = "src/main.rs"

[features]
default = ["bundled"]
bundled = ["duckdb/json", "duckdb/parquet"]

[dependencies]
bigdecimal = "=0.4.11"
clap = { version = "4", features = ["derive"] }
duckdb = "1.4.4"
cmdrvl-tabular = { git = "https://github.com/cmdrvl/tabular", rev = "f461f34d221cbce098857706afe51adbee0872f4", default-features = false }
csv = "1.4"
gag = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
blake3 = "1"
hmac = "=0.12.1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
spine-rules = {
    git = "https://github.com/cmdrvl/spine-rules",
    rev = "f96638f7c65597d658182253350f1320002976e3",
    version = "=0.3.1",
}
